version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"   # Keycloak on 8180, so Rust can use 8080
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data: